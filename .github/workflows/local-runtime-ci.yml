name: Local runtime and public release CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  local-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source without LFS payloads
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: runtime/pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: integrations/deepseek-harness-local/package-lock.json

      - name: Install CPU runtime and tests
        run: |
          python -m pip install --upgrade 'pip>=26.1.2' wheel
          python -m pip install 'torch==2.11.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e './runtime[test]'

      - name: Compile local runtime and release tools
        run: python -m compileall -q runtime/src runtime/tests scripts/audit_public_release.py scripts/smoke_local_api.py

      - name: Check shell entry points
        run: >-
          bash -n
          scripts/install-local.sh
          scripts/start-local.sh
          scripts/uninstall-local.sh
          scripts/install-codex-local.sh
          scripts/install-deepseek-harness-local.sh

      - name: Test shared owner-local agent hooks
        working-directory: integrations/local-agent-hooks
        run: npm test

      - name: Test and package DeepSeek Harness preview
        working-directory: integrations/deepseek-harness-local
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
          npm run --silent pack:check > package-audit.json
          node -e "const p=require('./package-audit.json')[0]; if (!p || p.entryCount !== 7) process.exit(1)"
          rm package-audit.json

      - name: Run local runtime tests
        working-directory: runtime
        run: python -m pytest

      - name: Audit Python application dependencies
        run: |
          python -m pip install 'pip-audit==2.10.1'
          python -m pip_audit ./runtime

      - name: Audit DeepSeek Harness production dependencies
        working-directory: integrations/deepseek-harness-local
        run: npm audit --omit=dev

      - name: Audit public release boundary
        run: python scripts/audit_public_release.py --history

  windows-entry-points:
    runs-on: windows-latest
    steps:
      - name: Check out source without LFS payloads
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Parse PowerShell entry points
        shell: pwsh
        run: |
          $scripts = Get-ChildItem -LiteralPath scripts -Filter '*.ps1'
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count) {
              throw "$($script.Name): $($errors[0].Message)"
            }
          }

      - name: Test Windows owner-local hook state
        working-directory: integrations/local-agent-hooks
        run: npm test
